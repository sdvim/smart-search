[build]
command = "pnpm build"
publish = "dist"
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "22.12.0"

[functions]
node_bundler = "esbuild"
included_files = ["data/items.jsonl", "data/portfolio.json"]

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
